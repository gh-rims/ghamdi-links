<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>الغامدي لإصلاح الجنوط</title>
    <!-- استدعاء خط عصري يشبه خطوط المواقع الاحترافية -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --orange: #ff7700; --white: #ffffff; --black: #121212; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--black); text-align: center; margin: 0; padding: 20px; color: var(--white); }
        .container { max-width: 450px; margin: auto; }
        
        /* دائرة الشعار بحجم متناسق ومضبوط */
        .logo-container {
            width: 120px; height: 120px; margin: 0 auto 20px auto;
            border-radius: 50%; background: #ffffff; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 3px solid var(--white);
            overflow: hidden;
        }
        /* ضبط حجم الشعار داخلياً ليكون متناسقاً تماماً */
        .logo { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
        
        h1 { color: var(--white); margin-bottom: 5px; font-weight: 700; }
        p { color: #cccccc; margin-bottom: 30px; font-weight: 400; }
        
        /* الأزرار: بيضاء، إطار برتقالي عريض، نص أسود */
        .btn { 
            display: block; background: var(--white); 
            border: 4px solid var(--orange); /* إطار برتقالي عريض */
            padding: 16px; margin: 15px 0; text-decoration: none;
            color: #000000; font-weight: bold; border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn:hover { background: var(--orange); color: var(--white); border-color: var(--white); transform: scale(1.02); }
        
        .footer { margin-top: 40px; color: #777; font-size: 0.85em; padding: 20px; border-top: 1px solid #333; }
    </style>
</head>
<body>
    <div class="container">
        <!-- الشعار بحجم متناسق داخل الدائرة البيضاء -->
        <div class="logo-container">
