<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار تقييم - الغامدي لإصلاح الجنوط</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f5f5f5;
    color:#111;
    font-family:"Cairo",Tahoma,Arial,sans-serif;
}

.box{
    width:min(94%,500px);
    margin:40px auto;
    background:#fff;
    padding:25px 20px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.10);
}

h1{
    margin:0 0 8px;
    text-align:center;
    font-size:23px;
}

p{
    text-align:center;
    color:#666;
    font-size:14px;
}

label{
    display:block;
    margin:18px 0 8px;
    font-weight:bold;
}

select,
input,
textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:12px;
    padding:13px;
    font-family:inherit;
    font-size:15px;
    background:#fff;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.stars{
    display:flex;
    direction:rtl;
    justify-content:center;
    gap:4px;
    margin:10px 0;
}

.star{
    border:0;
    background:none;
    color:#ccc;
    font-size:42px;
    cursor:pointer;
}

.star.selected{
    color:#f28c00;
}

#ratingText{
    text-align:center;
    color:#666;
    min-height:25px;
}

button.send{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:13px;
    background:#f28c00;
    color:#fff;
    font-family:inherit;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button.send:active{
    transform:scale(.98);
}

#message{
    margin-top:18px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>تقييم تجربتك</h1>

<p>
الغامدي لإصلاح الجنوط
</p>

<label>
اختر الفرع *
</label>

<select id="branch">
<option value="">اختر الفرع</option>
<option value="جدة - كيلو١٤">جدة - كيلو١٤</option>
<option value="جدة - كيلو٣">جدة - كيلو٣</option>
<option value="جميع الفروع">جميع الفروع</option>
</select>


<label>
كيف تقيّم تجربتك؟ *
</label>

<div class="stars">

<button type="button" class="star" data-star="5">★</button>
<button type="button" class="star" data-star="4">★</button>
<button type="button" class="star" data-star="3">★</button>
<button type="button" class="star" data-star="2">★</button>
<button type="button" class="star" data-star="1">★</button>

</div>

<div id="ratingText">
اختر عدد النجوم
</div>


<label>
اكتب وصف تجربتك
</label>

<textarea
id="description"
placeholder="اكتب وصف تجربتك [اختياري]"></textarea>


<label>
الاسم
</label>

<input
id="name"
type="text"
placeholder="اكتب اسمك [اختياري]">


<button
type="button"
class="send"
onclick="sendRating()">

إرسال التقييم

</button>

<div id="message"></div>

</div>


<!--
هذا الـ iframe يستقبل نتيجة Google Forms
بدون مغادرة الصفحة
-->
<iframe
name="googleFormFrame"
style="display:none">
</iframe>


<script>

/* =========================================
   رابط استقبال Google Forms
========================================= */

const FORM_URL =
"https://docs.google.com/forms/d/e/1FAIpQLScUi49Oi8q_kmRCy7MTBuuZRHkxit4FM7ZH263opaQ8Ip0aBg/formResponse";


/* =========================================
   معرفات حقول Google Forms
========================================= */

const ENTRY = {

    type:
    "entry.1416305078",

    branch:
    "entry.1051316798",

    rating:
    "entry.724366756",

    description:
    "entry.884733964",

    name:
    "entry.1513918262"

};


/* =========================================
   التقييم الحالي
========================================= */

let rating = 0;


/* =========================================
   اختيار النجوم
========================================= */

document
.querySelectorAll(".star")
.forEach(button => {

    button.addEventListener("click",function(){

        rating =
        Number(this.dataset.star);

        document
        .querySelectorAll(".star")
        .forEach(star => {

            const value =
            Number(star.dataset.star);

            star.classList.toggle(
                "selected",
                value <= rating
            );

        });


        const text = {

            1:"⭐ نجمة واحدة",

            2:"⭐⭐ نجمتان",

            3:"⭐⭐⭐ 3 نجوم",

            4:"⭐⭐⭐⭐ 4 نجوم",

            5:"⭐⭐⭐⭐⭐ 5 نجوم"

        };

        document
        .getElementById("ratingText")
        .textContent = text[rating];

    });

});


/* =========================================
   إرسال التقييم
========================================= */

function sendRating(){

    const branch =
    document
    .getElementById("branch")
    .value;


    const description =
    document
    .getElementById("description")
    .value
    .trim();


    const name =
    document
    .getElementById("name")
    .value
    .trim();


    /* التحقق */

    if(!branch){

        alert("فضلاً اختر الفرع.");

        return;
    }


    if(!rating){

        alert("فضلاً اختر التقييم بالنجوم.");

        return;
    }


    /*
       إنشاء Form حقيقي
       وإرساله مباشرة إلى Google Forms
    */

    const form =
    document.createElement("form");


    form.method =
    "POST";


    form.action =
    FORM_URL;


    form.target =
    "googleFormFrame";


    form.style.display =
    "none";


    /* نوع الرسالة */

    addField(
        form,
        ENTRY.type,
        "⭐ تقييم"
    );


    /* الفرع */

    addField(
        form,
        ENTRY.branch,
        branch
    );


    /* التقييم */

    addField(
        form,
        ENTRY.rating,
        "⭐".repeat(rating)
    );


    /* الوصف */

    addField(
        form,
        ENTRY.description,
        description
    );


    /* الاسم */

    addField(
        form,
        ENTRY.name,
        name
    );


    document.body.appendChild(form);


    /*
       إرسال النموذج
    */

    form.submit();


    /*
       حذف النموذج بعد الإرسال
    */

    setTimeout(function(){

        form.remove();

    },1000);


    /*
       رسالة للمستخدم
    */

    document
    .getElementById("message")
    .textContent =
    "✓ تم إرسال التقييم بنجاح";


    /*
       تنظيف المدخلات
    */

    document
    .getElementById("branch")
    .value = "";


    document
    .getElementById("description")
    .value = "";


    document
    .getElementById("name")
    .value = "";


    rating = 0;


    document
    .querySelectorAll(".star")
    .forEach(star =>
        star.classList.remove("selected")
    );


    document
    .getElementById("ratingText")
    .textContent =
    "اختر عدد النجوم";

}


/* =========================================
   إنشاء حقل مخفي
========================================= */

function addField(form,name,value){

    const input =
    document.createElement("input");

    input.type =
    "hidden";

    input.name =
    name;

    input.value =
    value ?? "";

    form.appendChild(input);

}

</script>

</body>
</html>
