<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا - الغامدي لإصلاح الجنوط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff7700;
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 25px;
            border-bottom: 2px solid #ff7700;
            display: inline-block;
            padding-bottom: 8px;
        }
        .gallery-container {
            max-width: 450px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px; /* مسافة بين كل صورة وأخرى */
        }
        .image-box {
            background-color: #1a1a1a;
            border: 3px solid #ff7700;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            background: #ffffff;
            color: #000;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #ff7700;
        }
    </style>
</head>
<body>

    <!-- عنوان الصفحة -->
    <h1>خدماتنا في العناية بالجنوط</h1>

    <!-- حاوية عرض الصور بالتمرير -->
    <div class="gallery-container">
        <div class="image-box">
            <img src="1.jpeg" alt="خدمة 1">
        </div>
        <div class="image-box">
            <img src="2.jpeg" alt="خدمة 2">
        </div>
        <div class="image-box">
            <img src="3.jpeg" alt="خدمة 3">
        </div>
        <div class="image-box">
            <img src="4.jpeg" alt="خدمة 4">
        </div>
        <div class="image-box">
            <img src="5.webp" alt="خدمة 5">
        </div>
        <div class="image-box">
            <img src="6.webp" alt="خدمة 6">
        </div>
    </div>

    <!-- زر العودة للرئيسية -->
    <a href="index.html" class="back-btn">العودة للرئيسية</a>

</body>
</html>
