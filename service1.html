<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا - الغامدي لإصلاح الجنوط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; text-align: center; }
        .full-width-img { width: 100%; display: block; margin-bottom: 20px; }
        .gallery-container { max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding: 0 20px; }
        .image-box { background-color: #1a1a1a; border: 3px solid #ff7700; border-radius: 12px; padding: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .image-box img { width: 100%; height: auto; border-radius: 8px; display: block; }

        /* --- تصميم معرض الصور التلقائي --- */
        .slideshow-wrapper {
            margin: 20px auto 40px auto;
            width: 90%;
            max-width: 450px;
            position: relative;
            border: 3px solid #ff7700;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            background-color: #000;
            aspect-ratio: 4/3;
        }
        .mySlides { display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .mySlides img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .fade { animation: fade 1.5s; }
        @keyframes fade { from {opacity: .4} to {opacity: 1} }
        .dot-container { text-align: center; padding: 10px; background: rgba(0,0,0,0.5); position: absolute; bottom: 0; width: 100%; z-index: 10; }
        .dot { height: 10px; width: 10px; margin: 0 4px; background-color: #bbb; border-radius: 50%; display: inline-block; cursor: pointer; }
        .active { background-color: #ff7700; }

        .back-btn { display: inline-block; margin-top: 30px; margin-bottom: 30px; background: #ffffff; color: #000; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 8px; border: 2px solid #ff7700; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <img src="front.jpeg" alt="خدماتنا" class="full-width-img">

    <!-- العنوان الجديد -->
    <h2 style="color: #ff7700; margin-top: 30px; margin-bottom: 10px;">رش بوية هايبر كروم</h2>

    <!-- معرض الصور التلقائي -->
    <div class="slideshow-wrapper">
        <div class="mySlides fade"><img src="h1.jpg" alt="صورة 1"></div>
        <div class="mySlides fade"><img src="h2.jpg" alt="صورة 2"></div>
        <div class="mySlides fade"><img src="h3.jpg" alt="صورة 3"></div>
        <div class="mySlides fade"><img src="h4.png" alt="صورة 4"></div>
        <div class="dot-container">
            <span class="dot"></span> <span class="dot"></span> <span class="dot"></span> <span class="dot"></span>
        </div>
    </div>

    <!-- مجموعة الصور الأولى -->
    <div class="gallery-container">
        <div class="image-box"><img src="k1.jpeg" alt="k1"></div>
        <div class="image-box"><img src="k2.jpeg" alt="k2"></div>
        <div class="image-box"><img src="k3.jpeg" alt="k3"></div>
        <div class="image-box"><img src="k4.jpeg" alt="k4"></div>
        <div class="image-box"><img src="k5.jpeg" alt="k5"></div>
        <div class="image-box"><img src="k6.jpeg" alt="k6"></div>
        <div class="image-box"><img src="k7.jpg" alt="k7"></div>
        <div class="image-box"><img src="K8.jpg" alt="k8"></div>
        <div class="image-box"><img src="k9.jpeg" alt="k9"></div>
    </div>

    <!-- الصورة c4 -->
    <img src="c4.jpeg" alt="c4" class="full-width-img">

    <!-- باقي الصور -->
    <div class="gallery-container" style="margin-top: 20px;">
        <div class="image-box"><img src="c1.jpeg" alt="c1"></div>
        <div class="image-box"><img src="c2.jpeg" alt="c2"></div>
    </div>

    <a href="index.html" class="back-btn">العودة للرئيسية</a>

    <script>
        let slideIndex = 0;
        showSlides();
        function showSlides() {
            let i;
            let slides = document.getElementsByClassName("mySlides");
            let dots = document.getElementsByClassName("dot");
            for (i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
            slideIndex++;
            if (slideIndex > slides.length) {slideIndex = 1}
            for (i = 0; i < dots.length; i++) { dots[i].className = dots[i].className.replace(" active", ""); }
            slides[slideIndex-1].style.display = "block";
            dots[slideIndex-1].className += " active";
            setTimeout(showSlides, 3000);
        }
    </script>
</body>
</html>
