
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الخدمة - الغامدي لإصلاح الجنوط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --orange: #ff7700; --white: #ffffff; --black: #121212; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--black); text-align: center; margin: 0; padding: 20px; color: var(--white); }
        .catalog-card { max-width: 420px; background-color: #1a1a1a; border: 3px solid var(--orange); border-radius: 15px; margin: 0 auto; padding: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); box-sizing: border-box; }
        .service-title { background-color: var(--black); color: var(--white); font-size: 1.1em; font-weight: 700; padding: 10px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #333; }
        .promo-banner { background-color: var(--orange); color: var(--black); font-weight: 700; font-size: 1em; padding: 8px; border-radius: 6px; margin-bottom: 15px; }
        .section-box { border: 3px solid var(--orange); border-radius: 10px; background-color: var(--black); margin-bottom: 15px; padding: 8px; position: relative; }
        .badge { background-color: var(--black); color: var(--white); border: 2px solid var(--orange); font-weight: 700; padding: 4px 20px; border-radius: 6px; display: inline-block; margin-bottom: 8px; font-size: 0.95em; }
        .img-container { width: 100%; height: 220px; background-color: #000; border-radius: 6px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .watermark-logo { position: absolute; bottom: 8px; left: 8px; width: 40px; height: auto; opacity: 0.85; }
        .card-footer { margin-top: 15px; font-size: 0.85em; color: #ccc; border-top: 1px solid #333; padding-top: 10px; line-height: 1.6; }
        .back-btn { display: inline-block; margin-top: 20px; background: var(--white); color: #000; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 8px; border: 2px solid var(--orange); }
    </style>
</head>
<body>
    <div class="catalog-card">
        <div class="service-title">رش بوية مع تلميع حافة الجنط</div>
        <div class="promo-banner">رجعنا للجنوط لمعة الوكالة</div>

        <!-- قسم قبل -->
        <div class="section-box">
            <div class="badge">قبل</div>
            <div class="img-container">
                <img src="1.jpeg" alt="قبل الإصلاح">
                <img src="Bbb5.png" alt="شعار" class="watermark-logo">
            </div>
        </div>

        <!-- قسم بعد -->
        <div class="section-box" style="margin-bottom: 5px;">
            <div class="badge">بعد</div>
            <div class="img-container">
                <img src="2.jpeg" alt="بعد الإصلاح">
                <img src="Bbb5.png" alt="شعار" class="watermark-logo">
            </div>
        </div>

        <div class="card-footer">
            <strong>الغامدي لإصلاح الجنوط جدة</strong><br>
            كيلو١٤ الصناعية الجديدة 0562904736 | كيلو٣ مجمع الاطارات 0507578871
        </div>
    </div>
    <a href="index.html" class="back-btn">العودة للرئيسية</a>
</body>
</html>
