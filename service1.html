<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا - الغامدي لإصلاح الجنوط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        /* صورة الهيدر تغطي العرض بالكامل */
        .header-img {
            width: 100%;
            display: block;
            margin-bottom: 20px;
        }
        .gallery-container {
            max-width: 450px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 20px 20px 20px;
        }
        .image-box {
            background-color: #1a1a1a;
            border: 3px solid #ff7700;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 30px;
            background: #ffffff;
            color: #000;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #ff7700;
        }
    </style>
</head>
<body>

    <!-- صورة الهيدر المعدلة بالاسم الصحيح -->
    <img src="front.jpeg" alt="خدماتنا" class="header-img">

    <!-- حاوية عرض الصور -->
    <div class="gallery-container">
        <div class="image-box"><img src="1.jpeg" alt="خدمة 1"></div>
        <div class="image-box"><img src="2.jpeg" alt="خدمة 2"></div>
        <div class="image-box"><img src="3.jpeg" alt="خدمة 3"></div>
        <div class="image-box"><img src="4.jpeg" alt="خدمة 4"></div>
        <div class="image-box"><img src="5.webp" alt="خدمة 5"></div>
        <div class="image-box"><img src="6.webp" alt="خدمة 6"></div>
    </div>

    <a href="index.html" class="back-btn">العودة للرئيسية</a>

</body>
</html>
