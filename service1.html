<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا - الغامدي لإصلاح الجنوط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; text-align: center; }
        .full-width-img { width: 100%; display: block; margin-bottom: 20px; }
        .gallery-container { max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding: 0 20px; }
        .image-box { background-color: #1a1a1a; border: 3px solid #ff7700; border-radius: 12px; padding: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .image-box img { width: 100%; height: auto; border-radius: 8px; display: block; }

        /* --- تصميم عارض السحب --- */
        .img-comparision-container {
            position: relative; width: 90%; max-width: 350px; margin: 0 auto 20px auto;
            border: 3px solid #ff7700; border-radius: 12px; overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5); background-color: #1a1a1a; user-select: none;
        }
        .img-comparision-container img { display: block; width: 100%; height: auto; pointer-events: none; }
        .img-comp-redo { position: absolute; top: 0; left: 0; height: 100%; overflow: hidden; width: 50%; }
        .img-comp-redo img { position: absolute; top: 0; left: 0; height: 100%; max-width: none; }
        .img-comp-slider {
            position: absolute; z-index: 9; cursor: ew-resize; width: 35px; height: 35px;
            background-color: #ff7700; border-radius: 50%; left: 50%; top: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
        }
        .img-comp-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background-color: #ff7700; z-index: 8; transform: translateX(-50%); }

        /* --- تصميم عارض النقر للتبديل --- */
        .toggle-container {
            position: relative; width: 90%; max-width: 350px; margin: 0 auto 40px auto;
            border: 3px solid #ff7700; border-radius: 12px; overflow: hidden;
            cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .toggle-img { width: 100%; display: block; transition: opacity 0.4s ease; }
        .label-badge {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.7); color: #ff7700; padding: 5px 15px;
            border-radius: 5px; font-weight: bold;
        }

        .back-btn { display: inline-block; margin-bottom: 30px; background: #ffffff; color: #000; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 8px; border: 2px solid #ff7700; }
    </style>
</head>
<body>

    <img src="front.jpeg" alt="خدماتنا" class="full-width-img">

    <!-- 1. عارض السحب -->
    <h3 style="color: #ff7700;">اسحب للمقارنة</h3>
    <div class="img-comparision-container" id="beforeAfterSlider">
        <img src="z2.jpg" alt="بعد">
        <div class="img-comp-redo" id="redoWrapper">
            <img src="z1.jpg" alt="قبل" id="redoImg">
        </div>
        <div class="img-comp-line"></div>
        <div class="img-comp-slider" id="sliderHandle">↔</div>
    </div>

    <!-- 2. عارض النقر للتبديل -->
    <h3 style="color: #ff7700;">اضغط للتبديل (قبل/بعد)</h3>
    <div class="toggle-container" id="toggleContainer">
        <img id="toggleImg" class="toggle-img" src="z1.jpg" alt="صورة">
        <div id="imgLabel" class="label-badge">قبل</div>
    </div>

    <div class="gallery-container">
        <div class="image-box"><img src="k1.jpeg" alt="k1"></div>
        <div class="image-box"><img src="k2.jpeg" alt="k2"></div>
        <div class="image-box"><img src="k3.jpeg" alt="k3"></div>
        <div class="image-box"><img src="k4.jpeg" alt="k4"></div>
        <div class="image-box"><img src="k5.jpeg" alt="k5"></div>
        <div class="image-box"><img src="k6.jpeg" alt="k6"></div>
        <div class="image-box"><img src="k7.jpg" alt="k7"></div>
        <div class="image-box"><img src="K8.jpg" alt="k8"></div>
        <div class="image-box"><img src="k9.jpeg" alt="k9"></div>
    </div>

    <img src="c4.jpeg" alt="c4" class="full-width-img">

    <div class="gallery-container" style="margin-top: 20px;">
        <div class="image-box"><img src="c1.jpeg" alt="c1"></div>
        <div class="image-box"><img src="c2.jpeg" alt="c2"></div>
    </div>

    <a href="index.html" class="back-btn">العودة للرئيسية</a>

    <script>
        // كود السحب
        function initComparisons() {
            var slider = document.getElementById("beforeAfterSlider");
            var wrapper = document.getElementById("redoWrapper");
            var handle = document.getElementById("sliderHandle");
            var redoImg = document.getElementById("redoImg");
            function adjust() { redoImg.style.width = slider.offsetWidth + "px"; }
            window.addEventListener("load", adjust); adjust();
            
            function slide(x) {
                var rect = slider.getBoundingClientRect();
                var pos = Math.max(0, Math.min(x - rect.left, rect.width));
                var pct = (pos / rect.width) * 100;
                wrapper.style.width = pct + "%"; handle.style.left = pct + "%";
            }
            handle.addEventListener("mousedown", (e) => { document.onmousemove = (e) => slide(e.clientX); });
            window.onmouseup = () => { document.onmousemove = null; };
            handle.addEventListener("touchstart", (e) => { document.ontouchmove = (e) => slide(e.touches[0].clientX); });
        }
        initComparisons();

        // كود النقر للتبديل
        const img = document.getElementById('toggleImg');
        const lbl = document.getElementById('imgLabel');
        let state = true;
        document.getElementById('toggleContainer').onclick = () => {
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = state ? 'z2.jpg' : 'z1.jpg';
                lbl.innerText = state ? 'بعد' : 'قبل';
                state = !state;
                img.style.opacity = 1;
            }, 400);
        };
    </script>
</body>
</html>
