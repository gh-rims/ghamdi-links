<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا - الغامدي لإصلاح الجنوط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; text-align: center; }
        .full-width-img { width: 100%; display: block; margin-bottom: 20px; }
        .gallery-container { max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding: 0 20px; }
        .image-box { background-color: #1a1a1a; border: 3px solid #ff7700; border-radius: 12px; padding: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .image-box img { width: 100%; height: auto; border-radius: 8px; display: block; }

        /* --- معرض الصور التلقائي (مربع 1:1) --- */
        .slideshow-wrapper {
            margin: 20px auto; width: 90%; max-width: 350px;
            position: relative; border: 3px solid #ff7700; border-radius: 16px;
            overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            background-color: #000; aspect-ratio: 1 / 1;
        }
        .mySlides { display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .mySlides img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .fade { animation: fade 1.5s; }
        @keyframes fade { from {opacity: .4} to {opacity: 1} }
        .dot-container { text-align: center; padding: 8px; background: rgba(0,0,0,0.5); position: absolute; bottom: 0; width: 100%; }
        .dot { height: 10px; width: 10px; margin: 0 4px; background-color: #bbb; border-radius: 50%; display: inline-block; }
        .active { background-color: #ff7700; }

        /* --- عارض النقر للتبديل --- */
        .toggle-container {
            position: relative; width: 90%; max-width: 350px; margin: 30px auto 40px auto;
            border: 3px solid #ff7700; border-radius: 12px; overflow: hidden;
            cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .toggle-img { width: 100%; display: block; transition: opacity 0.4s ease; }
        .label-badge {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.7); color: #ff7700; padding: 5px 15px;
            border-radius: 5px; font-weight: bold;
        }

        .back-btn { display: inline-block; margin-bottom: 30px; background: #ffffff; color: #000; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 8px; border: 2px solid #ff7700; }
    </style>
</head>
<body>

    <img src="front.jpeg" alt="خدماتنا" class="full-width-img">

    <h2 style="color: #ff7700; margin-top: 30px; margin-bottom: 5px;">رش بوية هايبر كروم</h2>
    <!-- معرض الصور التلقائي -->
    <div class="slideshow-wrapper">
        <div class="mySlides fade"><img src="h1.jpg" alt="1"></div>
        <div class="mySlides fade"><img src="h2.jpg" alt="2"></div>
        <div class="mySlides fade"><img src="h3.jpg" alt="3"></div>
        <div class="mySlides fade"><img src="h4.png" alt="4"></div>
        <div class="dot-container">
            <span class="dot"></span> <span class="dot"></span> <span class="dot"></span> <span class="dot"></span>
        </div>
    </div>

    <h3 style="color: #ff7700; margin-top: 0;">اضغط للتبديل (قبل/بعد)</h3>
    <!-- عارض النقر للتبديل -->
    <div class="toggle-container" id="toggleContainer">
        <img id="toggleImg" class="toggle-img" src="z1.jpg" alt="صورة">
        <div id="imgLabel" class="label-badge">قبل</div>
    </div>

    <div class="gallery-container">
        <div class="image-box"><img src="k1.jpeg" alt="k1"></div>
        <div class="image-box"><img src="k2.jpeg" alt="k2"></div>
        <div class="image-box"><img src="k3.jpeg" alt="k3"></div>
        <div class="image-box"><img src="k4.jpeg" alt="k4"></div>
        <div class="image-box"><img src="k5.jpeg" alt="k5"></div>
        <div class="image-box"><img src="k6.jpeg" alt="k6"></div>
        <div class="image-box"><img src="k7.jpg" alt="k7"></div>
        <div class="image-box"><img src="K8.jpg" alt="k8"></div>
        <div class="image-box"><img src="k9.jpeg" alt="k9"></div>
    </div>

    <img src="c4.jpeg" alt="c4" class="full-width-img">

    <div class="gallery-container" style="margin-top: 20px;">
        <div class="image-box"><img src="c1.jpeg" alt="c1"></div>
        <div class="image-box"><img src="c2.jpeg" alt="c2"></div>
    </div>

    <a href="index.html" class="back-btn">العودة للرئيسية</a>

    <script>
        // معرض الصور التلقائي
        let slideIndex = 0;
        showSlides();
        function showSlides() {
            let i;
            let slides = document.getElementsByClassName("mySlides");
            let dots = document.getElementsByClassName("dot");
            for (i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
            slideIndex++;
            if (slideIndex > slides.length) {slideIndex = 1}
            for (i = 0; i < dots.length; i++) { dots[i].className = dots[i].className.replace(" active", ""); }
            slides[slideIndex-1].style.display = "block";
            dots[slideIndex-1].className += " active";
            setTimeout(showSlides, 3000);
        }

        // النقر للتبديل
        const img = document.getElementById('toggleImg');
        const lbl = document.getElementById('imgLabel');
        let state = true;
        document.getElementById('toggleContainer').onclick = () => {
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = state ? 'z2.jpg' : 'z1.jpg';
                lbl.innerText = state ? 'بعد' : 'قبل';
                state = !state;
                img.style.opacity = 1;
            }, 400);
        };
    </script>
</body>
</html>
