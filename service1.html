<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا - الغامدي لإصلاح الجنوط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; text-align: center; }
        .full-width-img { width: 100%; display: block; margin-bottom: 20px; }
        .gallery-container { max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding: 0 20px; }
        .image-box { background-color: #1a1a1a; border: 3px solid #ff7700; border-radius: 12px; padding: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .image-box img { width: 100%; height: auto; border-radius: 8px; display: block; }

        /* --- تصميم المعارض المربعة 1:1 --- */
        .slideshow-wrapper {
            margin: 20px auto 30px auto; width: 90%; max-width: 350px;
            position: relative; border: 3px solid #ff7700; border-radius: 16px;
            overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            background-color: #000; aspect-ratio: 1 / 1;
        }
        .mySlides1, .mySlides2 { display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .mySlides1 img, .mySlides2 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .fade { animation: fade 1.5s; }
        @keyframes fade { from {opacity: .4} to {opacity: 1} }
        .dot-container { text-align: center; padding: 8px; background: rgba(0,0,0,0.5); position: absolute; bottom: 0; width: 100%; z-index: 10; }
        .dot1, .dot2 { height: 10px; width: 10px; margin: 0 4px; background-color: #bbb; border-radius: 50%; display: inline-block; }
        .active { background-color: #ff7700; }

        /* --- تصميم حاوية التبديل --- */
        .toggle-wrapper { margin: 20px auto 40px auto; width: 90%; max-width: 350px; }
        .toggle-container {
            position: relative; border: 3px solid #ff7700; border-radius: 12px;
            overflow: hidden; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .toggle-img { width: 100%; display: block; transition: opacity 0.4s ease; }
        .label-badge {
            position: absolute; bottom: 10px; right: 10px; background: rgba(0, 0, 0, 0.7);
            color: #ff7700; padding: 5px 15px; border-radius: 5px; font-weight: bold;
        }
        h3 { color: #ff7700; margin-bottom: 5px; margin-top: 20px; }
        .back-btn { display: inline-block; margin-bottom: 30px; background: #ffffff; color: #000; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 8px; border: 2px solid #ff7700; }
    </style>
</head>
<body>

    <img src="front.jpeg" alt="خدماتنا" class="full-width-img">

    <!-- المعارض التلقائية -->
    <h2 style="color: #ff7700; margin-top: 30px; margin-bottom: 5px;">رش بوية هايبر كروم</h2>
    <div class="slideshow-wrapper">
        <div class="mySlides1 fade"><img src="h1.jpg" alt="1"></div>
        <div class="mySlides1 fade"><img src="h2.jpg" alt="2"></div>
        <div class="mySlides1 fade"><img src="h3.jpg" alt="3"></div>
        <div class="mySlides1 fade"><img src="h4.png" alt="4"></div>
        <div class="dot-container"><span class="dot1"></span> <span class="dot1"></span> <span class="dot1"></span> <span class="dot1"></span></div>
    </div>

    <h2 style="color: #ff7700; margin-top: 10px; margin-bottom: 5px;">رش جنوط اسود / لامع / نص لمعه / مطفي</h2>
    <div class="slideshow-wrapper">
        <div class="mySlides2 fade"><img src="b1.jpg" alt="1"></div>
        <div class="mySlides2 fade"><img src="b2.jpg" alt="2"></div>
        <div class="mySlides2 fade"><img src="b3.jpg" alt="3"></div>
        <div class="dot-container"><span class="dot2"></span> <span class="dot2"></span> <span class="dot2"></span></div>
    </div>

    <!-- عارض التبديل الأساسي (z1/z2) -->
    <h3>قبل / بعد</h3>
    <div class="toggle-wrapper">
        <div class="toggle-container" onclick="toggleImage(this, 'z1.jpg', 'z2.jpg')">
            <img class="toggle-img" src="z1.jpg" alt="قبل وبعد">
            <div class="label-badge">قبل</div>
        </div>
    </div>

    <!-- الخدمات الـ 6 الجديدة -->
    <script>
        const services = [
            { title: "تكحيل الجنوط", before: "b1.jpg", after: "a1.jpg" },
            { title: "تغيير مظهر الجنوط", before: "b2.jpg", after: "a2.jpg" },
            { title: "تلميع بوليش (تنكيل)", before: "b3.jpg", after: "a3.png" },
            { title: "معالجة الخدوش بـ CNC", before: "b4.png", after: "a4.png" },
            { title: "إصلاح خدوش الجنوط", before: "b5.png", after: "a5.png" },
            { title: "مسح ماسي CNC", before: "b6.jpg", after: "a6.jpg" }
        ];

        services.forEach(service => {
            document.write(`
                <h3>${service.title}</h3>
                <div class="toggle-wrapper">
                    <div class="toggle-container" onclick="toggleImage(this, '${service.before}', '${service.after}')">
                        <img class="toggle-img" src="${service.before}" alt="${service.title}">
                        <div class="label-badge">قبل</div>
                    </div>
                </div>
            `);
        });

        function toggleImage(container, beforeSrc, afterSrc) {
            const img = container.querySelector('.toggle-img');
            const label = container.querySelector('.label-badge');
            img.style.opacity = 0;
            setTimeout(() => {
                const isBefore = img.src.includes(beforeSrc);
                img.src = isBefore ? afterSrc : beforeSrc;
                label.innerText = isBefore ? 'بعد' : 'قبل';
                img.style.opacity = 1;
            }, 400);
        }
    </script>

    <!-- الصور الأصلية -->
    <div class="gallery-container">
        <div class="image-box"><img src="k1.jpeg" alt="k1"></div>
        <div class="image-box"><img src="k2.jpeg" alt="k2"></div>
        <div class="image-box"><img src="k3.jpeg" alt="k3"></div>
        <div class="image-box"><img src="k4.jpeg" alt="k4"></div>
        <div class="image-box"><img src="k5.jpeg" alt="k5"></div>
        <div class="image-box"><img src="k6.jpeg" alt="k6"></div>
        <div class="image-box"><img src="k7.jpg" alt="k7"></div>
        <div class="image-box"><img src="K8.jpg" alt="k8"></div>
        <div class="image-box"><img src="k9.jpeg" alt="k9"></div>
    </div>

    <img src="c4.jpeg" alt="c4" class="full-width-img">

    <div class="gallery-container" style="margin-top: 20px;">
        <div class="image-box"><img src="c1.jpeg" alt="c1"></div>
        <div class="image-box"><img src="c2.jpeg" alt="c2"></div>
    </div>

    <a href="index.html" class="back-btn">العودة للرئيسية</a>

    <script>
        // تفعيل المعارض التلقائية
        function runSlides(slideClass, dotClass) {
            let idx = 0;
            let slides = document.getElementsByClassName(slideClass);
            let dots = document.getElementsByClassName(dotClass);
            function next() {
                for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
                idx = (idx + 1 > slides.length) ? 1 : idx + 1;
                for (let i = 0; i < dots.length; i++) dots[i].className = dots[i].className.replace(" active", "");
                slides[idx-1].style.display = "block";
                dots[idx-1].className += " active";
                setTimeout(next, 3000);
            }
            next();
        }
        runSlides("mySlides1", "dot1");
        runSlides("mySlides2", "dot2");
    </script>
</body>
</html>
