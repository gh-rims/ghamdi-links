<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا - الغامدي لإصلاح الجنوط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; text-align: center; }
        .full-width-img { width: 100%; display: block; margin-bottom: 20px; }
        .gallery-container { max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding: 0 20px; }
        .image-box { background-color: #1a1a1a; border: 3px solid #ff7700; border-radius: 12px; padding: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .image-box img { width: 100%; height: auto; border-radius: 8px; display: block; }

        /* --- تنسيق معارض الصور التلقائية (مشترك) --- */
        .slideshow-wrapper {
            margin: 20px auto 40px auto;
            width: 90%;
            max-width: 450px;
            position: relative;
            border: 3px solid #ff7700;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            background-color: #000;
            aspect-ratio: 4/3;
        }
        .mySlides1, .mySlides2 { /* تمييز كلاسات المعارض */
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        .mySlides1 img, .mySlides2 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* تأثير التلاشي */
        .fade {
            animation-name: fade;
            animation-duration: 1.5s;
        }
        @keyframes fade {
            from {opacity: .4} 
            to {opacity: 1}
        }
        /* نقاط التنقل السفلية */
        .dot-container {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 10;
        }
        .dot1, .dot2 {
            height: 10px; width: 10px; margin: 0 4px;
            background-color: #bbb; border-radius: 50%;
            display: inline-block; transition: background-color 0.6s ease;
        }
        .active, .dot:hover { background-color: #ff7700; }

        .back-btn { display: inline-block; margin-bottom: 30px; background: #ffffff; color: #000; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 8px; border: 2px solid #ff7700; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <img src="front.jpeg" alt="خدماتنا" class="full-width-img">

    <!-- 1. معرض هايبر كروم -->
    <h2 style="color: #ff7700; margin-top: 30px; margin-bottom: 10px;">رش بوية هايبر كروم</h2>
    <div class="slideshow-wrapper" id="slideshow1">
        <div class="mySlides1 fade"><img src="h1.jpg" alt="1"></div>
        <div class="mySlides1 fade"><img src="h2.jpg" alt="2"></div>
        <div class="mySlides1 fade"><img src="h3.jpg" alt="3"></div>
        <div class="mySlides1 fade"><img src="h4.png" alt="4"></div>
        <div class="dot-container">
            <span class="dot1"></span> <span class="dot1"></span> <span class="dot1"></span> <span class="dot1"></span>
        </div>
    </div>

    <!-- 2. معرض الجنوط الأسود (الجديد) -->
    <h2 style="color: #ff7700; margin-top: 30px; margin-bottom: 10px;">رش جنوط اسود / لامع / نص لمعه / مطفي</h2>
    <div class="slideshow-wrapper" id="slideshow2">
        <div class="mySlides2 fade"><img src="b1.jpg" alt="أسود لامع"></div>
        <div class="mySlides2 fade"><img src="b2.jpg" alt="أسود نص لمعة"></div>
        <div class="mySlides2 fade"><img src="b3.jpg" alt="أسود مطفي"></div>
        <div class="dot-container">
            <span class="dot2"></span> <span class="dot2"></span> <span class="dot2"></span>
        </div>
    </div>

    <!-- مجموعة الصور الأولى -->
    <div class="gallery-container">
        <div class="image-box"><img src="k1.jpeg" alt="k1"></div>
        <div class="image-box"><img src="k2.jpeg" alt="k2"></div>
        <div class="image-box"><img src="k3.jpeg" alt="k3"></div>
        <div class="image-box"><img src="k4.jpeg" alt="k4"></div>
        <div class="image-box"><img src="k5.jpeg" alt="k5"></div>
        <div class="image-box"><img src="k6.jpeg" alt="k6"></div>
        <div class="image-box"><img src="k7.jpg" alt="k7"></div>
        <div class="image-box"><img src="K8.jpg" alt="k8"></div>
        <div class="image-box"><img src="k9.jpeg" alt="k9"></div>
    </div>

    <!-- الصورة c4 -->
    <img src="c4.jpeg" alt="c4" class="full-width-img">

    <!-- باقي الصور -->
    <div class="gallery-container" style="margin-top: 20px;">
        <div class="image-box"><img src="c1.jpeg" alt="c1"></div>
        <div class="image-box"><img src="c2.jpeg" alt="c2"></div>
    </div>

    <a href="index.html" class="back-btn">العودة للرئيسية</a>

    <!-- كود جافاسكريبت لتشغيل المعارض -->
    <script>
        // وظيفة عامة لتشغيل المعرض
        function startSlideshow(slideClass, dotClass) {
            let slideIndex = 0;
            let slides = document.getElementsByClassName(slideClass);
            let dots = document.getElementsByClassName(dotClass);
            
            function showSlides() {
                let i;
                for (i = 0; i < slides.length; i++) {
                    slides[i].style.display = "none";  
                }
                slideIndex++;
                if (slideIndex > slides.length) {slideIndex = 1}    
                for (i = 0; i < dots.length; i++) {
                    dots[i].className = dots[i].className.replace(" active", "");
                }
                slides[slideIndex-1].style.display = "block";  
                dots[slideIndex-1].className += " active";
                setTimeout(showSlides, 3000); // تغيير كل 3 ثواني
            }
            showSlides();
        }

        // تشغيل المعرض الأول (هايبر كروم)
        startSlideshow("mySlides1", "dot1");
        
        // تشغيل المعرض الثاني (الجنوط الأسود)
        startSlideshow("mySlides2", "dot2");
    </script>

</body>
</html>
