<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا - الغامدي لإصلاح الجنوط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        /* تنسيق الصور التي تغطي العرض بالكامل */
        .full-width-img {
            width: 100%;
            display: block;
            margin-bottom: 20px;
        }
        /* حاوية الصور التي تحتوي على إطار */
        .gallery-container {
            max-width: 450px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 20px;
        }
        .image-box {
            background-color: #1a1a1a;
            border: 3px solid #ff7700;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            margin-bottom: 30px;
            background: #ffffff;
            color: #000;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #ff7700;
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <img src="front.jpeg" alt="خدماتنا" class="full-width-img">

    <!-- مجموعة الصور الأولى -->
    <div class="gallery-container">
        <div class="image-box"><img src="k1.jpeg" alt="خدمة k1"></div>
        <div class="image-box"><img src="k2.jpeg" alt="خدمة k2"></div>
        <div class="image-box"><img src="k3.jpeg" alt="خدمة k3"></div>
        <div class="image-box"><img src="k4.jpeg" alt="خدمة k4"></div>
        <div class="image-box"><img src="k5.jpeg" alt="خدمة k5"></div>
        <div class="image-box"><img src="k6.jpeg" alt="خدمة k6"></div>
        <div class="image-box"><img src="k7 .jpg" alt="خدمة k6"></div>
        <div class="image-box"><img src="k8.jpg" alt="خدمة k6"></div>
        <div class="image-box"><img src="k9.jpeg" alt="خدمة k6"></div>
    </div>

    <!-- الصورة c4 -->
    <img src="c4.jpeg" alt="عرض خدمة c4" class="full-width-img">

    <!-- باقي الصور -->
    <div class="gallery-container" style="margin-top: 20px;">
        <div class="image-box"><img src="c1.jpeg" alt="خدمة c1"></div>
        <div class="image-box"><img src="c2.jpeg" alt="خدمة c2"></div>
    </div>

    <a href="index.html" class="back-btn">العودة للرئيسية</a>

</body>
</html>
