<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الغامدي لإصلاح الجنوط - تواصل وتقييم</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background-color: #FFFFFF; color: #1B557F; line-height: 1.7; }

        /* رأس الصفحة */
        .page-header { background: linear-gradient(135deg, #1B557F 0%, #164a6f 100%); color: #fff; padding: 30px 20px; text-align: center; border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; box-shadow: 0 4px 15px rgba(27, 85, 127, 0.2); }
        .logo { width: 110px; height: auto; margin-bottom: 12px; border-radius: 12px; background: #fff; padding: 5px; }
        .page-header h1 { font-size: 26px; margin-bottom: 6px; font-weight: 700; }
        .subtitle { font-size: 17px; opacity: 0.92; }

        /* الحاوية العامة */
        .container { max-width: 470px; margin: -25px auto 40px; padding: 0 18px; position: relative; z-index: 10; }

        /* البطاقات */
        .card { background: #ffffff; border-radius: 18px; padding: 28px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); margin-bottom: 22px; border-top: 4px solid #F47B00; }

        /* العناوين */
        h2 { color: #1B557F; text-align: center; margin-bottom: 22px; font-size: 22px; }
        .label { display: block; margin: 14px 0 6px; font-weight: 600; color: #1B557F; }
        .req { color: #F47B00; font-size: 18px; }
        .hint { font-size: 13px; color: #666; margin-right: 4px; }

        /* حقول الإدخال */
        input, select, textarea { width: 100%; padding: 14px 16px; border: 2px solid #e8e8e8; border-radius: 12px; font-size: 16px; background: #fefefe; transition: all 0.3s ease; color: #1B557F; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #F47B00; background: #fff; box-shadow: 0 0 0 4px rgba(244, 123, 0, 0.1); }
        textarea { resize: vertical; min-height: 110px; }

        /* تقييم النجوم */
        .stars-container { display: flex; gap: 10px; justify-content: center; margin: 12px 0; font-size: 34px; }
        .star { color: #ddd; cursor: pointer; transition: color 0.2s, transform 0.1s; }
        .star.active, .star:hover { color: #F47B00; transform: scale(1.15); }
        .checkbox-field { display: flex; align-items: center; gap: 8px; margin-top: 18px; font-weight: normal; cursor: pointer; }
        .checkbox-field input { width: auto; transform: scale(1.2); }

        /* الأزرار */
        .btn { width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; transition: background 0.3s, transform 0.2s; }
        .btn-primary { background-color: #F47B00; color: #ffffff; margin-top: 22px; }
        .btn-primary:hover { background-color: #d66a00; transform: translateY(-2px); }
        .btn-back { background-color: #1B557F; color: #fff; margin-bottom: 10px; }
        .btn-back:hover { background-color: #154568; }

        /* رسائل التنبيه */
        .alert { padding: 16px; border-radius: 12px; margin: 18px 0; text-align: center; display: none; font-weight: 500; }
        .alert-success { background: #e6f9e9; color: #155724; border: 1px solid #badbcc; }
        .alert-error { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }

        /* معلومات الاتصال السفلية */
        .contact-footer { text-align: center; font-size: 14px; color: #1B557F; padding: 10px 15px 30px; line-height: 1.8; }
        .contact-footer strong { color: #F47B00; }

        /* التذييل */
        .page-footer { text-align: center; padding: 15px; color: #777; font-size: 13px; }
    </style>
</head>
<body>

<!-- رأس الصفحة -->
<header class="page-header">
    <img src="Ligo.jpg" alt="شعار الغامدي لإصلاح الجنوط" class="logo">
    <h1>الغامدي لإصلاح الجنوط</h1>
    <p class="subtitle">رأيك يهمنا.. شاركنا تقييمك، اقتراحك أو شكواك</p>
</header>

<!-- المحتوى الرئيسي -->
<main class="container">
    <!-- زر العودة -->
    <a href="https://gh-rims.github.io/ghamdi-links/" class="btn btn-back">← العودة للرئيسية</a>

    <!-- بطاقة النموذج -->
    <div class="card">
        <h2>📬 تواصل معنا</h2>

        <!-- رسائل النجاح والخطأ -->
        <div id="successMsg" class="alert alert-success">✅ تم إرسال رسالتك بنجاح، سنتواصل معك قريباً!</div>
        <div id="errorMsg" class="alert alert-error">❌ الرجاء التأكد من ملء البيانات بشكل صحيح!</div>

        <form id="contactForm">
            <!-- نوع الرسالة -->
            <label class="label">نوع الرسالة <span class="req">*</span></label>
            <select id="msgType" name="type" required>
                <option value="">-- اختر نوعاً --</option>
                <option value="تقييم">تقييم</option>
                <option value="اقتراح">اقتراح</option>
                <option value="شكوى">شكوى</option>
            </select>

            <!-- الاسم -->
            <label class="label">الاسم الكامل <span class="req">*</span></label>
            <input type="text" name="name" required placeholder="أدخل اسمك الثلاثي">

            <!-- رقم الجوال -->
            <label class="label">رقم الجوال <span class="req">*</span> <span class="hint">(يبدأ بـ 05 – 10 أرقام)</span></label>
            <input type="tel" id="phone" name="phone" required placeholder="05xxxxxxxxx" maxlength="10">

            <!-- حقول ديناميكية -->
            <div id="dynamicFields"></div>

            <!-- زر الإرسال -->
            <button type="submit" class="btn btn-primary">إرسال الرسالة</button>
        </form>
    </div>
</main>

<!-- العنوان والجوال فقط بخط صغير -->
<div class="contact-footer">
    جدة – كيلو 14 – الصناعية الجديدة<br>
    📞 0567705074
</div>

<!-- تذييل الصفحة -->
<footer class="page-footer">
    © 2026 الغامدي لإصلاح الجنوط
</footer>

<script>
// عناصر الصفحة
const typeSelector = document.getElementById('msgType');
const fieldsContainer = document.getElementById('dynamicFields');
const form = document.getElementById('contactForm');
const successMsg = document.getElementById('successMsg');
const errorMsg = document.getElementById('errorMsg');

// تحميل الحقول بناءً على النوع
typeSelector.addEventListener('change', () => {
    const type = typeSelector.value;
    let html = '';

    if (type === 'تقييم') {
        html = `
            <label class="label">تقييمك <span class="req">*</span></label>
            <div class="stars-container" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <input type="hidden" name="rating" id="ratingVal" required>
            <label class="checkbox-field">
                <input type="checkbox" name="showPublic" value="نعم">
                السماح للآخرين بالاطلاع على تجربتي
            </label>
            <label class="label">الوصف والتفاصيل <span class="req">*</span></label>
            <textarea name="message" required placeholder="اكتب تجربتك وتفاصيل تقييمك هنا..."></textarea>
        `;
    } else if (type === 'اقتراح') {
        html = `
            <label class="label">الوصف <span class="req">*</span></label>
            <textarea name="message" required placeholder="نسعد باقتراحاتكم وآرائكم..."></textarea>
        `;
    } else if (type === 'شكوى') {
        html = `
            <label class="label">الخدمة التي تمت (اختياري)</label>
            <input type="text" name="service" placeholder="مثال: تعديل جنط، دهان...">
            <label class="label">وصف الشكوى <span class="req">*</span></label>
            <textarea name="message" required placeholder="اشرح المشكلة بالتفصيل وماذا حدث..."></textarea>
        `;
    }

    fieldsContainer.innerHTML = html;
    initStars(); // تفعيل النجوم إذا ظهرت
});

// تفعيل وظيفة النجوم
function initStars() {
    const stars = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('ratingVal');
    if (!stars.length) return;

    stars.forEach(star => {
        star.addEventListener('click', () => {
            const val = star.dataset.value;
            ratingInput.value = val;
            stars.forEach(s => s.classList.toggle('active', s.dataset.value <= val));
        });
        star.addEventListener('mouseover', () => {
            stars.forEach(s => s.classList.toggle('active', s.dataset.value <= star.dataset.value));
        });
        star.addEventListener('mouseout', () => {
            stars.forEach(s => s.classList.toggle('active', s.dataset.value <= (ratingInput?.value || 0)));
        });
    });
}

// التحقق من صحة رقم الجوال
function validatePhone(phone) {
    const regex = /^05[0-9]{8}$/;
    return regex.test(phone);
}

// معالجة الإرسال المحدث بالرمز الآمن
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    successMsg.style.display = 'none';
    errorMsg.style.display = 'none';

    // 1. التحقق من الجوال
    const phoneVal = document.getElementById('phone').value;
    if (!validatePhone(phoneVal)) {
        errorMsg.textContent = '❌ رقم الجوال غير صحيح! يجب أن يبدأ بـ 05 ويتكون من 10 أرقام فقط.';
        errorMsg.style.display = 'block';
        return;
    }

    // 2. التحقق من التقييم إذا كان النوع تقييم
    if (typeSelector.value === 'تقييم') {
        const rating = document.getElementById('ratingVal').value;
        if (!rating) {
            errorMsg.textContent = '❌ الرجاء اختيار عدد النجوم للتقييم.';
            errorMsg.style.display = 'block';
            return;
        }
    }

    // جمع البيانات
    const formData = new FormData(form);
    const data = Object.fromEntries(formData);

    try {
        // ✅ تم تحديث الرابط بالرمز الآمن المعطى لك
        const response = await fetch('https://formsubmit.co/ajax/f0d327c60b3b6fd056b82526c5529259', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            successMsg.style.display = 'block';
            form.reset();
            fieldsContainer.innerHTML = '';
        } else {
            throw new Error('فشل الإرسال');
        }
    } catch (err) {
        errorMsg.textContent = '❌ حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.';
        errorMsg.style.display = 'block';
    }
});

// قراءة حالة الإرسال من الرابط إن وجدت
const params = new URLSearchParams(window.location.search);
if (params.get('ok') === '1') successMsg.style.display = 'block';
if (params.get('err') === '1') errorMsg.style.display = 'block';
</script>

</body>
</html>
